<!DOCTYPE html>
<html>

<head>
    <title>Cart Quantity</title>
</head>

<body>

    <p id="cartQuantity">Cart Quantity: 0</p>

    <button onclick="
        document.getElementById('cartQuantity').innerHTML =
        'Cart Quantity: ' + cartQuantity;
    ">
        Show Quantity
    </button>

    <button onclick="
        cartQuantity = cartQuantity + 1;

        document.getElementById('cartQuantity').innerHTML =
        'Cart Quantity: ' + cartQuantity;
    ">
        Add to Cart
    </button>

    <button onclick="
        cartQuantity = cartQuantity + 2;

        document.getElementById('cartQuantity').innerHTML =
        'Cart Quantity: ' + cartQuantity;
    ">
        +2
    </button>

    <button onclick="
        cartQuantity = cartQuantity + 3;

        document.getElementById('cartQuantity').innerHTML =
        'Cart Quantity: ' + cartQuantity;
    ">
        +3
    </button>

    <button onclick="
        cartQuantity = 0;

        document.getElementById('cartQuantity').innerHTML =
        'Cart Quantity: ' + cartQuantity;
    ">
        Reset Cart
    </button>

    <script>
        let cartQuantity = 0;
    </script>

</body>

</html>
